networks:
  nsf-external-net:
    name: ${NETWORK_EXTERNAL_NAME}
    driver: bridge
  nsf-net:
    name: ${NETWORK_NAME}

volumes:
  postgres_data:
    name: ${VOLUME_NAME_POSTGRES}
  redis_data:
    name: ${VOLUME_NAME_REDIS}
    driver: local
  opensearch_data:
    name: ${VOLUME_NAME_OPENSEARCH}
    driver: local
  grafana-storage:
  keycloak_data:


  minio-data:
